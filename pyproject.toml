[project]
name = "frameft"
version = "0.1.0"
description = "FrameFT experiments"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate==0.34.2",
    "beautifulsoup4==4.12.3",
    "datasets==2.21.0",
    "evaluate==0.4.6",
    "fire==0.7.1",
    "huggingface-hub==0.24.6",
    "jsonlines==4.0.0",
    "matplotlib==3.9.2",
    "ninja==1.11.1.1",
    "nltk==3.10.3",
    "numexpr==2.14.2",
    "numpy==2.2.6",
    "peft",
    "pillow==10.4.0",
    "protobuf==6.33.6",
    "pyarrow==23.0.1",
    "pybind11==3.1.0",
    "pytablewriter==1.2.1",
    "rouge-score==0.1.2",
    "sacrebleu==2.6.0",
    "scikit-learn==1.5.1",
    "scipy==1.14.1",
    "seaborn==0.13.2",
    "sentencepiece==0.2.0",
    "setuptools==69.5.1",
    "sqlitedict==2.1.0",
    "tokenizers==0.19.1",
    "torch==2.7.1",
    "tqdm==4.66.4",
    "tqdm-multiprocess==0.0.11",
    "transformers==4.44.2",
    "wandb>=0.30.0",
    "word2number==1.1",
]

# torch comes from PyTorch's CUDA 12.8 server; everything else comes from PyPI
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
peft = { path = "peft", editable = true }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
